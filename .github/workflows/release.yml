---
name: Release

'on':
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a valid version (X.Y.Z)"; exit 1
          fi

          # Tags with a suffix (e.g. 1.0.0-rc.1) are marked as pre-release
          PRE=()
          [[ "$TAG" == *-* ]] && PRE=(--prerelease)

          gh release create "$TAG" --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REPOSITORY#*/} $TAG" \
            --notes "" "${PRE[@]}"
